[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betfair-results-downloader"
version = "0.5.0"
description = "Download Betfair cleared orders, write canonical + snapshots, and optionally publish market-level results to Azure SQL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "betfairlightweight",
    "pandas",
    "numpy",
    "pyodbc",
    "streamlit>=1.33",
    "plotly>=5.20",
    "pytz",
    "python-dateutil",
    "gspread>=6.0",
    "google-auth>=2.0",
]

[project.scripts]
betfair-results = "betfair_results_downloader.__main__:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = ["notebooks/**"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"scripts/**" = ["E402"]
