[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betfair-results-downloader"
version = "0.1.0"
description = "Download Betfair cleared orders, write canonical + snapshots, and optionally publish market-level results to Azure SQL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.33",
    "plotly>=5.20",
    "pytz",
    "python-dateutil",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
